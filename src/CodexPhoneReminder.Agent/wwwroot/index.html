<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151b2d"><title>Codex Reminder</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><style>.panel textarea{width:100%;margin:12px 0;padding:14px;border:1px solid #3a4564;border-radius:12px;background:#0e1424;font:inherit;resize:vertical}.card>div{min-width:0}.project,.title,.summary,.meta,.event p,.event pre,.approval h3,.approval p{max-width:100%;overflow-wrap:anywhere;word-break:break-word}.summary{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;white-space:normal!important;line-height:1.45;max-height:4.35em}.event p{white-space:pre-wrap;max-height:12em;overflow:auto}.event pre{max-height:16em;overflow:auto}</style></head><body><div id="app">
  <header><div><div class="eyebrow">CODEX PHONE REMINDER</div><h1>任务中心</h1></div><button id="refresh" class="icon">↻</button></header>
  <main><section id="pairing" class="panel hidden"><h2>连接电脑</h2><p>输入电脑端显示的一次性配对码。</p><form id="pair-form"><input id="pair-code" inputmode="numeric" maxlength="6" placeholder="6 位配对码" required><button>安全配对</button></form><small id="pair-error"></small></section>
  <section id="dashboard" class="hidden"><div class="hero"><span>需要你处理</span><strong id="attention">0</strong><small id="connection">正在连接…</small></div><div id="groups"></div></section>
  <section id="detail" class="hidden"></section><section id="settings" class="hidden"></section></main>
  <nav id="nav" class="hidden"><button data-view="dashboard" class="active">⌂<span>任务</span></button><button data-view="settings">⚙<span>设置</span></button></nav>
</div><div id="toast"></div><style>.chat-panel{background:#111729;border:1px solid #28314d;border-radius:20px;overflow:hidden;margin:16px 0}.chat-heading{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}.chat-heading h3{margin:3px 0}.chat-heading>span,.empty-chat,.running-note{font-size:12px;color:var(--muted)}.chat-messages{max-height:55vh;overflow:auto;padding:10px 14px}.bubble{max-width:88%;margin:10px 0;padding:11px 13px;border-radius:16px;background:#202842}.bubble.user{margin-left:auto;background:#5145a8}.bubble small{font-size:10px;color:#c5c9da}.bubble p{margin:6px 0;white-space:pre-wrap;line-height:1.5;overflow-wrap:anywhere}.composer{padding:8px 14px 14px;border-top:1px solid #29314a}.composer textarea{width:100%;margin:8px 0;padding:12px;border:1px solid #3a4564;border-radius:12px;background:#0e1424;font:inherit;resize:vertical}.composer-foot{display:flex;align-items:center;gap:12px}.composer-foot span{font-size:11px;color:var(--muted);flex:1}.composer-foot button{width:auto}.running-note{padding:14px;border-top:1px solid #29314a}.events-panel{padding:14px 4px}.events-panel>summary{cursor:pointer;color:var(--muted);margin-bottom:18px}</style><script src="/app.js"></script></body></html>
