plugins { id 'com.android.application' }

android {
    namespace 'com.codexphonereminder'
    compileSdk 36

    defaultConfig {
        applicationId 'com.codexphonereminder'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '0.8.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
